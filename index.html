<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#000000"><title>Boxing Timer</title><style>
*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:-apple-system,BlinkMacSystemFont,system-ui,sans-serif;background:#000;color:white}button,input{font:inherit}button{cursor:pointer;-webkit-tap-highlight-color:transparent}#setup{min-height:100dvh;display:flex;flex-direction:column;padding:calc(env(safe-area-inset-top) + 22px) 17px calc(env(safe-area-inset-bottom) + 30px)}header{height:73px;display:flex;align-items:center;justify-content:center;margin-bottom:26px;font-size:23px;font-weight:800;letter-spacing:.4px}.options{display:flex;flex-direction:column;gap:17px}.setting{display:flex;align-items:center;justify-content:space-between;background:#202020;min-height:68px;border-radius:15px;padding:10px 17px;gap:8px}.setting .name{font-size:19px;font-weight:600;display:flex;align-items:center;gap:6px}.controls{display:flex;align-items:center;gap:15px}.step{border:0;background:#fff;color:#161616;width:33px;height:33px;border-radius:50%;font-size:30px;line-height:1;display:flex;align-items:center;justify-content:center;padding:0 0 4px}.value{color:white;border:0;background:none;min-width:77px;text-align:center;font-size:24px;font-weight:650;padding:8px 0;font-variant-numeric:tabular-nums}.setting[data-key="rounds"] .value,.setting[data-key="switch"] .value,.setting[data-key="random"] .value{min-width:62px}.help{border:2px solid #898989;background:none;color:#aaa;border-radius:50%;font-size:13px;font-weight:800;width:18px;height:18px;line-height:14px;padding:0}.hint{background:#282828;color:white;border-radius:16px;padding:16px;line-height:1.45;font-size:14px;margin-top:-7px}.hidden{display:none!important}.push{flex:1;min-height:28px}.big{border:0;background:white;color:black;font-weight:850;font-size:27px;width:100%;min-height:76px;border-radius:18px;letter-spacing:.3px}.note{text-align:center;color:#787878;font-size:11px;margin-top:13px}#active{display:none;min-height:100dvh;flex-direction:column;text-align:center;padding:calc(env(safe-area-inset-top) + 40px) 17px calc(env(safe-area-inset-bottom) + 32px);background:#003f18}.center{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:24px}#phase{font-size:clamp(23px,7vw,35px);font-weight:750}#count{font-size:clamp(88px,24vw,140px);font-weight:750;letter-spacing:-5px;font-variant-numeric:tabular-nums;line-height:1}#active.rest{background:#741d17}#active.prepare{background:#a87100}#active.paused{filter:brightness(.78)}#active.done{background:#20304a}#active .big{margin-bottom:28px}.reset{align-self:center;border:0;border-radius:50%;width:59px;height:59px;background:#ffffff2b;color:#fff;font-size:32px;display:grid;place-items:center}dialog{background:#222;color:white;border:1px solid #444;border-radius:20px;width:min(90vw,360px);padding:22px}dialog::backdrop{background:#000b}dialog h2{margin:0 0 15px;font-size:20px}dialog input{display:block;width:100%;padding:12px;background:#111;border:1px solid #555;border-radius:11px;color:white;font-size:24px;outline:none}dialog p{font-size:13px;color:#aaa;margin:10px 0 18px}.modalbuttons{display:flex;gap:10px}.modalbuttons button{flex:1;padding:12px;border-radius:10px;border:0;background:#444;color:white}.modalbuttons button:last-child{background:white;color:black;font-weight:700}@media(min-width:560px){#setup,#active{max-width:500px;margin:auto}.setting{min-height:82px}.options{gap:18px}}
</style></head><body><main id="setup"><header>BOXING TIMER</header><div class="options" id="options"></div><div class="push"></div><button class="big" id="start">START</button><div class="note" id="notice">Audio continues when the screen is locked, if iOS permits playback.</div></main>
<main id="active"><div class="center"><div id="phase">Round 1 of 12</div><div id="count">2:00</div></div><button class="big" id="pause">PAUSE</button><button class="reset" id="reset" aria-label="Reset timer">↶</button></main>
<dialog id="edit"><form method="dialog" id="editform"><h2 id="editlabel">Set duration</h2><input id="editvalue" inputmode="decimal" autocomplete="off" required><p id="edithelp">Enter seconds or m:ss (e.g. 1:30).</p><div class="modalbuttons"><button type="button" id="cancel">Cancel</button><button type="submit">Save</button></div></form></dialog>
<audio id="sound" preload="auto" playsinline></audio>
<script>
const defaults={prepare:30,rounds:12,round:120,rest:45,switch:0,random:0};
let cfg={...defaults};try{cfg={...cfg,...JSON.parse(localStorage.getItem('boxingTimerSettings')||'{}')}}catch(e){}
const labels={prepare:'Prepare',rounds:'Rounds',round:'Round',rest:'Rest',switch:'Switch',random:'Random'};
const isTime=k=>['prepare','round','rest'].includes(k);
const cap={prepare:3600,rounds:99,round:3600,rest:3600,switch:20,random:50};
const $=id=>document.getElementById(id);
function format(s){s=Math.max(0,Math.ceil(s));return Math.floor(s/60)+':'+String(s%60).padStart(2,'0')}
function draw(){ $('options').innerHTML=Object.keys(labels).map(k=>`<div class="setting" data-key="${k}"><div class="name">${labels[k]}${['switch','random'].includes(k)?` <button class="help" data-help="${k}" aria-label="About ${k}">?</button>`:''}</div><div class="controls"><button class="step" data-step="-1" aria-label="Decrease ${labels[k]}">−</button><button class="value" data-edit="${k}" aria-label="Set ${labels[k]}">${isTime(k)?format(cfg[k]):cfg[k]}</button><button class="step" data-step="1" aria-label="Increase ${labels[k]}">+</button></div></div>`).join('')}
draw();
$('options').addEventListener('click',e=>{const help=e.target.closest('[data-help]');if(help){const k=help.dataset.help;const row=help.closest('.setting');const old=row.nextElementSibling;if(old?.classList.contains('hint')){old.remove();return}document.querySelectorAll('.hint').forEach(x=>x.remove());const d=document.createElement('div');d.className='hint';d.textContent=k==='switch'?'Divides each round into equal segments and plays a short sound between them. Set 0 to disable.':'Plays a set number of short signals at random points during each round. Set 0 to disable.';row.after(d);return}const step=e.target.closest('[data-step]');if(step){let k=step.closest('.setting').dataset.key;cfg[k]=Math.max(k==='rounds'||k==='round'?1:0,Math.min(cap[k],cfg[k]+(isTime(k)?5:1)*Number(step.dataset.step)));persist();draw();return}const value=e.target.closest('[data-edit]');if(value)edit(value.dataset.edit)});
function persist(){try{localStorage.setItem('boxingTimerSettings',JSON.stringify(cfg))}catch(e){}}
let editing;
function edit(k){editing=k;$('editlabel').textContent='Set '+labels[k];$('edithelp').textContent=isTime(k)?'Enter seconds or m:ss (e.g. 1:30).':'Enter a whole number.';$('editvalue').value=isTime(k)?format(cfg[k]):String(cfg[k]);$('edit').showModal();setTimeout(()=>$('editvalue').focus(),50)}
$('cancel').onclick=()=>$('edit').close();
$('editform').addEventListener('submit',e=>{e.preventDefault();let str=$('editvalue').value.trim(),n;if(isTime(editing)){if(/^\d+:\d{1,2}$/.test(str)){const a=str.split(':').map(Number);n=a[0]*60+a[1]}else if(/^\d+$/.test(str))n=Number(str);else return}else{if(!/^\d+$/.test(str))return;n=Number(str)}if(!Number.isFinite(n)||n<0||n>cap[editing]||(editing==='rounds'||editing==='round')&&n===0){$('edithelp').textContent='Enter a value from '+(editing==='rounds'||editing==='round'?1:0)+' to '+cap[editing]+'.';return}cfg[editing]=n;persist();draw();$('edit').close()});
let timeline=[],total=0,remaining=0,deadline=0,elapsedBefore=0,mode='ready',objectUrl=null,clock=null;
function plan(){let events=[],segments=[],at=0;const add=(type,len,num)=>{if(!len)return;segments.push({type,start:at,end:at+len,num});at+=len};add('prepare',cfg.prepare,0);for(let r=1;r<=cfg.rounds;r++){const begin=at;add('round',cfg.round,r);if(cfg.switch>1){for(let i=1;i<cfg.switch;i++)events.push({time:begin+cfg.round*i/cfg.switch,kind:'switch'})}if(cfg.random){for(let i=0;i<cfg.random;i++){const lo=1,hi=Math.max(1,cfg.round-1);events.push({time:begin+lo+(i+Math.random())/cfg.random*(hi-lo),kind:'random'})}}if(r<cfg.rounds)add('rest',cfg.rest,r)}for(let i=1;i<segments.length;i++)events.push({time:segments[i].start,kind:segments[i].type==='round'?'start':'end'});events.push({time:at,kind:'finish'});timeline=segments;total=at;return events}
function makeAudio(events){const rate=8000,tail=2.1,frames=Math.ceil((total+tail)*rate),bytes=44+frames*2;const b=new ArrayBuffer(bytes),v=new DataView(b);const word=(o,s)=>{for(let j=0;j<s.length;j++)v.setUint8(o+j,s.charCodeAt(j))};word(0,'RIFF');v.setUint32(4,bytes-8,true);word(8,'WAVE');word(12,'fmt ');v.setUint32(16,16,true);v.setUint16(20,1,true);v.setUint16(22,1,true);v.setUint32(24,rate,true);v.setUint32(28,rate*2,true);v.setUint16(32,2,true);v.setUint16(34,16,true);word(36,'data');v.setUint32(40,frames*2,true);
 // A very quiet continuous audio bed helps maintain lock-screen playback.
 const data=new Int16Array(b,44,frames);for(let i=0;i<frames;i++)data[i]=Math.round(7*Math.sin(2*Math.PI*173*i/rate));
 function tone(t,d,f,amp){const start=Math.round(t*rate),count=Math.round(d*rate);for(let j=0;j<count&&start+j<frames;j++){const envelope=Math.min(1,j/(rate*.008),(count-j)/(rate*.04));const a=Math.max(0,envelope)*amp*Math.sin(2*Math.PI*f*j/rate);const p=start+j;if(p>=0)data[p]=Math.max(-32768,Math.min(32767,data[p]+Math.round(a*32767)))}}
 for(const ev of events){if(ev.kind==='finish'){for(let j=0;j<3;j++)tone(ev.time+j*.42,.31,930,.33)}else if(ev.kind==='start'){tone(ev.time,.52,990,.36)}else if(ev.kind==='end'){tone(ev.time,.43,620,.33)}else{tone(ev.time,.16,ev.kind==='switch'?1100:790,.28)}}
 return new Blob([b],{type:'audio/wav'})}
const sound=$('sound');
function stop(){if(clock){clearInterval(clock);clock=null}sound.pause();sound.removeAttribute('src');sound.load();if(objectUrl){URL.revokeObjectURL(objectUrl);objectUrl=null}}
function refresh(){let passed=mode==='running'?elapsedBefore+(Date.now()-deadline)/1000:elapsedBefore;if(passed>=total){passed=total;if(mode==='running'){mode='done';clearInterval(clock);clock=null}}const s=timeline.find(x=>passed<x.end)||timeline.at(-1);const phase=mode==='done'?'Finished':s?.type==='round'?'Round '+s.num+' of '+cfg.rounds:s?.type==='rest'?'Rest · after round '+s.num:'Prepare';$('phase').textContent=phase;$('count').textContent=mode==='done'?'0:00':format(s.end-passed);const active=$('active');active.className=(s?.type||'')+(mode==='paused'?' paused':'')+(mode==='done'?' done':'');$('pause').textContent=mode==='paused'?'RESUME':mode==='done'?'DONE':'PAUSE';}
$('start').onclick=()=>{let events=plan();if(total>7200){$('notice').textContent='Session must be 2 hours or shorter for reliable audio generation.';return}try{stop();objectUrl=URL.createObjectURL(makeAudio(events));sound.src=objectUrl;elapsedBefore=0;deadline=Date.now();mode='running';$('setup').style.display='none';$('active').style.display='flex';refresh();clock=setInterval(refresh,150);sound.play().catch(()=>{stop();mode='ready';$('setup').style.display='flex';$('active').style.display='none';$('notice').textContent='Audio was blocked. Please tap Start again.'})}catch(e){stop();$('notice').textContent='Could not prepare audio. Try fewer or shorter rounds.'}};
$('pause').onclick=()=>{if(mode==='done'){$('reset').click();return}if(mode==='running'){elapsedBefore+=(Date.now()-deadline)/1000;sound.pause();mode='paused';if(clock){clearInterval(clock);clock=null}}else{deadline=Date.now();mode='running';sound.play().catch(()=>{$('phase').textContent='Tap Resume to enable sound'});clock=setInterval(refresh,150)}refresh()};
$('reset').onclick=()=>{stop();mode='ready';elapsedBefore=0;$('active').style.display='none';$('setup').style.display='flex'};
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&mode!=='ready')refresh()});
if('mediaSession'in navigator){navigator.mediaSession.metadata=new MediaMetadata({title:'Boxing Timer',artist:'Interval Timer'});navigator.mediaSession.setActionHandler('pause',()=>{if(mode==='running')$('pause').click()});navigator.mediaSession.setActionHandler('play',()=>{if(mode==='paused')$('pause').click()})}
</script></body></html>
